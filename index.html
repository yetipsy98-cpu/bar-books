<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鸡尾酒吧做账系统</title>
<style>
  :root{
    --nav:#14182b; --nav2:#1c2138; --gold:#e8b74a; --gold2:#d4a437;
    --bg:#f2f4f8; --card:#ffffff; --ink:#1f2a3a; --muted:#7a8699;
    --line:#e7ebf1; --ok:#1e9e5a; --bad:#e0483a; --blue:#2f6fed;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,sans-serif;
    background:var(--bg); color:var(--ink); font-size:14px;
  }
  .app{display:flex; min-height:100vh;}
  /* ---------- 侧栏 ---------- */
  .sidebar{
    width:230px; flex:0 0 230px; background:linear-gradient(180deg,var(--nav),var(--nav2));
    color:#cdd5e4; display:flex; flex-direction:column; position:sticky; top:0; height:100vh;
  }
  .brand{padding:22px 20px 6px; font-size:20px; font-weight:800; color:#fff;}
  .brand small{display:block; font-size:11px; color:var(--gold); font-weight:600; letter-spacing:.5px;}
  .shop-name{padding:2px 20px 16px; font-size:12px; color:#9aa5ba;}
  nav{flex:1; padding:6px 12px;}
  nav a{
    display:flex; align-items:center; gap:10px; padding:11px 12px; margin:2px 0;
    border-radius:10px; color:#c4cddd; text-decoration:none; cursor:pointer; font-weight:600;
    transition:.15s;
  }
  nav a:hover{background:rgba(255,255,255,.06); color:#fff;}
  nav a.active{background:linear-gradient(90deg,rgba(232,183,74,.18),rgba(232,183,74,.06)); color:var(--gold); box-shadow:inset 3px 0 0 var(--gold);}
  .sync-zone{padding:14px 16px; border-top:1px solid rgba(255,255,255,.08);}
  .btn-sync{
    width:100%; padding:11px; border:none; border-radius:10px; cursor:pointer; font-weight:700; font-size:13px;
    background:linear-gradient(135deg,var(--gold),var(--gold2)); color:#3a2c07;
  }
  .btn-sync:hover{filter:brightness(1.05);}
  .persist-note{font-size:11px; color:#f3c98b; margin-top:8px; line-height:1.4;}
  .ver{font-size:10px; color:#6b7690; padding:0 16px 14px;}
  /* ---------- 主区 ---------- */
  main{flex:1; padding:26px 30px 60px; max-width:1180px;}
  .page-head{margin-bottom:18px;}
  .page-head h1{font-size:22px; font-weight:800;}
  .page-head p{color:var(--muted); margin-top:4px;}
  .card{background:var(--card); border-radius:14px; box-shadow:0 1px 3px rgba(20,30,60,.06),0 8px 24px -18px rgba(20,30,60,.25); padding:20px; margin-bottom:18px;}
  .card h3{font-size:14px; margin-bottom:14px; display:flex; align-items:center; gap:8px;}
  .grid{display:grid; gap:14px;}
  .g2{grid-template-columns:repeat(2,1fr);}
  .g3{grid-template-columns:repeat(3,1fr);}
  .g4{grid-template-columns:repeat(4,1fr);}
  @media(max-width:900px){.g2,.g3,.g4{grid-template-columns:1fr 1fr;}}
  @media(max-width:600px){.g2,.g3,.g4{grid-template-columns:1fr;}}
  /* ---------- 表单 ---------- */
  label{display:block; font-size:12px; font-weight:700; color:#546072; margin:0 0 5px;}
  input,select{
    width:100%; padding:9px 11px; border:1.5px solid var(--line); border-radius:9px;
    font-size:14px; background:#fbfcfe; color:var(--ink); outline:none; transition:.15s;
  }
  input:focus,select:focus{border-color:var(--gold); background:#fff; box-shadow:0 0 0 3px rgba(232,183,74,.15);}
  .field{margin-bottom:12px;}
  .btn{
    padding:10px 16px; border:none; border-radius:9px; cursor:pointer; font-weight:700; font-size:13px;
    transition:.15s; background:#eef2f7; color:#33415a;
  }
  .btn:hover{background:#e2e8f0;}
  .btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold2)); color:#3a2c07;}
  .btn-blue{background:var(--blue); color:#fff;}
  .btn-danger{background:#fdecea; color:var(--bad);}
  .btn-sm{padding:6px 10px; font-size:12px; border-radius:7px;}
  .row{display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end;}
  .row .grow{flex:1; min-width:160px;}
  /* 销售实时小结 */
  .live-box{
    display:grid; grid-template-columns:repeat(5,1fr); gap:10px; background:#fbf7ec;
    border:1px dashed #e6d4a3; border-radius:12px; padding:12px 14px; margin-bottom:16px;
  }
  @media(max-width:700px){.live-box{grid-template-columns:repeat(2,1fr);}}
  .live-box .k{font-size:11px; color:#8a7a4c; font-weight:700;}
  .live-box .v{font-size:17px; font-weight:800; color:#4d3d0e; margin-top:2px;}
  .live-box .diff-ok{color:var(--ok);} .live-box .diff-bad{color:var(--bad);}
  /* ---------- 统计卡 ---------- */
  .stat{
    background:var(--card); border-radius:14px; padding:16px 18px;
    box-shadow:0 1px 3px rgba(20,30,60,.06),0 8px 24px -18px rgba(20,30,60,.25);
  }
  .stat .k{font-size:12px; color:var(--muted); font-weight:600;}
  .stat .v{font-size:21px; font-weight:800; margin-top:6px;}
  .stat .sub{font-size:11px; color:var(--muted); margin-top:4px;}
  .stat .v.good{color:var(--ok);} .stat .v.bad{color:var(--bad);}
  /* ---------- 表格 ---------- */
  .tblwrap{overflow-x:auto;}
  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{
    text-align:left; padding:10px 12px; background:#f6f8fb; color:#5a6779;
    font-size:11px; text-transform:uppercase; letter-spacing:.4px; border-bottom:1px solid var(--line);
    white-space:nowrap;
  }
  td{padding:9px 12px; border-bottom:1px solid #f0f3f7; white-space:nowrap;}
  tr:hover td{background:#fafbfd;}
  .num{text-align:right; font-variant-numeric:tabular-nums;}
  .tag{
    display:inline-block; padding:2px 9px; border-radius:99px; font-size:11px; font-weight:700;
    background:#eef2f7; color:#5a6779;
  }
  .tag.cogs{background:#fdeeee; color:#b3402f;}
  .tag.cap{background:#e8f5ee; color:#1e7a48;}
  .tag.drw{background:#fdeeee; color:#b3402f;}
  .diff-pill{font-weight:800;}
  .diff-pill.ok{color:var(--ok);} .diff-pill.bad{color:var(--bad);}
  .empty{text-align:center; color:var(--muted); padding:26px;}
  .muted{color:var(--muted);}
  .small{font-size:12px;}
  .section-title{
    font-size:13px; font-weight:800; color:#33415a; padding:14px 0 6px;
    border-bottom:2px solid var(--ink); margin:6px 0 8px; text-transform:uppercase; letter-spacing:.5px;
  }
  .pl-table td:last-child{text-align:right; font-variant-numeric:tabular-nums; font-weight:600;}
  .pl-table tr.total td{background:#fbf7ec; font-weight:800; border-top:1px solid #e6d4a3;}
  .chart{display:flex; align-items:flex-end; gap:10px; height:150px; padding:6px 4px 0;}
  .bar{flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; height:100%; justify-content:flex-end;}
  .bar .col{width:100%; background:linear-gradient(180deg,var(--gold),#e0b65c); border-radius:6px 6px 2px 2px; min-height:2px;}
  .bar .lbl{font-size:10px; color:var(--muted);}
  .bar .amt{font-size:10px; color:#7a6a3d; font-weight:700; writing-mode:vertical-rl; transform:rotate(180deg); max-height:74px; overflow:hidden;}
  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(80px);
    background:#1c2138; color:#fff; padding:12px 20px; border-radius:12px; font-weight:600;
    box-shadow:0 10px 30px rgba(0,0,0,.3); transition:.25s; z-index:99; opacity:0; pointer-events:none;
    max-width:90vw;
  }
  .toast.show{transform:translateX(-50%) translateY(0); opacity:1;}
  .partner-caps{display:grid; grid-template-columns:repeat(3,1fr); gap:12px;}
  @media(max-width:700px){.partner-caps{grid-template-columns:1fr;}}
  .pcap{background:#fbf7ec; border-radius:12px; padding:14px;}
  .pcap .n{font-weight:800; font-size:13px;}
  .pcap .ln{display:flex; justify-content:space-between; margin-top:8px; font-size:12px; color:#5a6779;}
  .pcap .ln b{color:var(--ink);}
  .hr{height:1px; background:var(--line); margin:14px 0;}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">🍸 酒吧账本 <small>BAR BOOKS · MY</small></div>
    <div class="shop-name" id="shopLabel">未设置店名</div>
    <nav id="nav">
      <a data-view="dashboard" class="active">📊 仪表盘</a>
      <a data-view="sales">🧾 每日销售</a>
      <a data-view="expenses">💸 费用支出</a>
      <a data-view="partners">🤝 合伙人账户</a>
      <a data-view="reports">📈 报表</a>
      <a data-view="settings">⚙️ 设置</a>
    </nav>
    <div class="sync-zone">
      <button class="btn-sync" id="syncBtn">☁️ 同步到 Google Sheets</button>
      <div class="persist-note" id="persistNote"></div>
      <div class="persist-note" id="lastSync" style="color:#8f9bb0;font-size:10px;margin-top:5px"></div>
    </div>
    <div class="ver">v1.0 · 马来西亚合伙做账</div>
  </aside>
  <main id="main"></main>
</div>
<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept=".json" style="display:none">

<script>
/* ================= 存储（localStorage + 内存兜底） ================= */
const LS = (()=>{
  const mem = {}; let ok = true;
  try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); }catch(e){ ok=false; }
  return {
    persistent: ok,
    get(k,d){ try{ const s=localStorage.getItem(k); return s==null? d : JSON.parse(s); }catch(e){ return (k in mem)? mem[k] : d; } },
    set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){ mem[k]=v; } }
  };
})();

const YEAR = new Date().getFullYear();
const DEFAULTS = {
  settings:{ shop:'', year:YEAR, serviceRate:10, partners:[{name:'合伙人1',pct:50},{name:'合伙人2',pct:50}], syncUrl:'' },
  sales:[], expenses:[], partners:[]
};
let state = LS.get('cocktail_acct_v1', DEFAULTS);
if(!state.settings || !state.settings.partners){ state = JSON.parse(JSON.stringify(DEFAULTS)); }

const CATEGORIES = ['酒水进货','食材进货','其他进货','租金','水电费','工资','EPF/SOCSO/EIS','执照费','市场推广','维修保养','保险','银行手续费','会计费','消耗品','音乐版权费','其他费用'];
const COGS_CATS  = ['酒水进货','食材进货','其他进货'];
const PAYS       = ['现金','银行转账','其他'];
const PTYPES     = ['资本投入','提款','归还资本','其他调整'];

/* ================= 工具 ================= */
function saveLocal(){ LS.set('cocktail_acct_v1', state); }
function save(){ saveLocal(); schedulePush(); }
let pushTimer=null;
function schedulePush(){
  if(!(state.settings.syncUrl||'').trim()) return;
  clearTimeout(pushTimer);
  pushTimer=setTimeout(pushAll, 1500);
}
function markSync(msg){ const el=document.getElementById('lastSync'); if(el) el.textContent=msg+' · '+new Date().toLocaleTimeString(); }
function sheetUrl(){ return (state.settings.syncUrl||'').trim(); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function num(v){ const n=parseFloat(v); return isNaN(n)?0:n; }
function r2(n){ return Math.round((n+Number.EPSILON)*100)/100; }
const MYR = new Intl.NumberFormat('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2});
function rm(n){ return 'RM '+MYR.format(r2(n)); }
function dstr(d){ const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0'); return y+'-'+m+'-'+dd; }
function todayStr(){ return dstr(new Date()); }
function monthRange(y,m){ const last=new Date(y,m,0).getDate(); return {from: y+'-'+String(m).padStart(2,'0')+'-01', to: y+'-'+String(m).padStart(2,'0')+'-'+String(last).padStart(2,'0')}; }
function readNum(id){ const el=document.getElementById(id); return el? num(el.value) : 0; }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2600); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ================= 销售计算 ================= */
function calcRow(x){
  const liquor=num(x.liquor), food=num(x.food), soft=num(x.soft), disc=num(x.discount);
  const net = r2(liquor+food+soft-disc);
  const service = r2(net * (state.settings.serviceRate||0)/100);
  const receivable = r2(net+service);
  const collected = r2(num(x.cash)+num(x.card)+num(x.tng)+num(x.grab)+num(x.duitnow)+num(x.boost)+num(x.other));
  return { liquor, food, soft, disc, net, service, receivable, collected, diff: r2(collected-receivable) };
}
function sortAsc(a,b){ return a.date.localeCompare(b.date) || (a.ts-b.ts); }
function sortDesc(a,b){ return b.date.localeCompare(a.date) || (b.ts-a.ts); }

/* ================= 汇总计算 ================= */
function calcPL(from,to){
  const sels = state.sales.filter(x=>x.date>=from && x.date<=to);
  const exps = state.expenses.filter(x=>x.date>=from && x.date<=to);
  let liquor=0,food=0,soft=0,disc=0,service=0,net=0,receivable=0,collected=0,diff=0;
  sels.forEach(x=>{ const c=calcRow(x); liquor+=c.liquor; food+=c.food; soft+=c.soft; disc+=c.disc; service+=c.service; net+=c.net; receivable+=c.receivable; collected+=c.collected; diff+=c.diff; });
  const cogs={}, opex={}; let cogsT=0, opexT=0;
  exps.forEach(x=>{ const a=num(x.amount); const c=x.category||'其他费用';
    if(COGS_CATS.includes(c)){ cogs[c]=(cogs[c]||0)+a; cogsT+=a; }
    else{ opex[c]=(opex[c]||0)+a; opexT+=a; } });
  const income = net+service;
  const gross = net-cogsT;
  const netProfit = gross-opexT;
  return { liquor, food, soft, disc, net, service, income, cogs, cogsT, opex, opexT, gross, netProfit, sels, exps, diff };
}
function partnerSummary(){
  return state.settings.partners.map(p=>{
    let cap=0, drw=0;
    state.partners.forEach(x=>{ if(x.partner!==p.name) return;
      if(x.type==='资本投入') cap+=num(x.amount);
      if(x.type==='归还资本') cap-=num(x.amount);
      if(x.type==='提款') drw+=num(x.amount);
    });
    return { name:p.name, pct:p.pct, cap:r2(cap), drw:r2(drw), net:r2(cap-drw) };
  });
}

/* ================= 视图切换 ================= */
const VIEWS = { dashboard:renderDashboard, sales:renderSales, expenses:renderExpenses, partners:renderPartners, reports:renderReports, settings:renderSettings };
function go(view){ document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('active', a.dataset.view===view)); VIEWS[view](); }
document.getElementById('nav').addEventListener('click', e=>{ const a=e.target.closest('a'); if(a) go(a.dataset.view); });
document.getElementById('syncBtn').addEventListener('click', syncNow);

function head(title, sub){ return '<div class="page-head"><h1>'+title+'</h1><p>'+sub+'</p></div>'; }

/* ================= 仪表盘 ================= */
function renderDashboard(){
  const shop = state.settings.shop || '我的酒吧';
  document.getElementById('shopLabel').textContent = shop+' · '+state.settings.year;
  const today = todayStr();
  const m = new Date().getMonth()+1, y = new Date().getFullYear();
  const mr = monthRange(y,m);
  const pl = calcPL(mr.from, mr.to);
  const ytd = calcPL(state.settings.year+'-01-01', state.settings.year+'-12-31');
  // 最近7天柱状图
  const days=[]; for(let i=6;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-(i)); days.push(dstr(d)); }
  const daySum = {}; days.forEach(d=>daySum[d]=0);
  state.sales.forEach(x=>{ if(daySum[x.date]!==undefined) daySum[x.date]+=calcRow(x).net; });
  const maxV = Math.max(1, ...days.map(d=>daySum[d]));
  const bars = days.map(d=>{
    const v=daySum[d]; const h=Math.max(2, Math.round(v/maxV*100));
    return '<div class="bar"><div class="amt">'+MYR.format(v)+'</div><div class="col" style="height:'+h+'%"></div><div class="lbl">'+d.slice(5)+'</div></div>';
  }).join('');
  const ps = partnerSummary();
  const recent = [
    ...state.sales.slice().sort(sortDesc).slice(0,4).map(x=>({d:x.date,t:'销售',s:rm(calcRow(x).net)})),
    ...state.expenses.slice().sort(sortDesc).slice(0,4).map(x=>({d:x.date,t:'费用 · '+(x.category||''),s:'-'+rm(num(x.amount))}))
  ].sort((a,b)=>b.d.localeCompare(a.d)).slice(0,6);
  const pcap = ps.map(p=>'<div class="pcap"><div class="n">👤 '+esc(p.name)+'（'+p.pct+'%）</div>'+
    '<div class="ln"><span>资本投入</span><b>'+rm(p.cap)+'</b></div>'+
    '<div class="ln"><span>提款</span><b>'+rm(p.drw)+'</b></div>'+
    '<div class="ln"><span>净投入</span><b>'+rm(p.net)+'</b></div></div>').join('');

  document.getElementById('main').innerHTML =
    head('仪表盘', dstr(new Date())+' · 本月概览') +
    '<div class="grid g4" style="margin-bottom:18px">'+
      stat('本月净销售', rm(pl.net), '服务费 '+rm(pl.service))+
      stat('本月毛利', rm(pl.gross), '毛利率 '+(pl.net? (pl.gross/pl.net*100).toFixed(1):'0')+'%', pl.gross>=0)+
      stat('本月净利润', rm(pl.netProfit), '合伙人分配前', pl.netProfit>=0)+
      stat('收款差额', rm(pl.diff), '应为 0，非 0 要查', pl.diff===0)+
    '</div>'+
    '<div class="grid g3" style="grid-template-columns:1.4fr 1fr; margin-bottom:18px">'+
      '<div class="card"><h3>📅 最近 7 天净销售</h3><div class="chart">'+bars+'</div></div>'+
      '<div class="card"><h3>🕘 最近动态</h3>'+
        (recent.length? recent.map(r=>'<div class="ln" style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f0f3f7"><span class="small">'+r.d+' · '+esc(r.t)+'</span><b>'+r.s+'</b></div>').join('') : '<div class="empty">还没有数据，先去填「每日销售」</div>')+
      '</div>'+
    '</div>'+
    '<div class="card"><h3>🤝 合伙人资金一览</h3><div class="partner-caps">'+(pcap||'<span class="muted">去「设置」添加合伙人</span>')+'</div></div>'+
    '<div class="grid g3" style="margin-top:18px">'+
      stat('今年至今·净销售', rm(ytd.net))+
      stat('今年至今·净利润', rm(ytd.netProfit), '', ytd.netProfit>=0)+
      stat('已记录销售', state.sales.length+' 天', '费用 '+state.expenses.length+' 笔')+
    '</div>';
  function stat(k,v,sub,good){
    const cls = good===undefined? '' : (good?'good':'bad');
    return '<div class="stat"><div class="k">'+k+'</div><div class="v '+cls+'">'+v+'</div>'+(sub?'<div class="sub">'+sub+'</div>':'')+'</div>';
  }
}

/* ================= 每日销售 ================= */
let editingSalesId=null;
function salesFormHTML(){
  return '<form id="salesForm">'+
  '<div class="card"><h3>📝 记录当天销售（收工后填一行）</h3>'+
    '<div class="live-box">'+
      '<div><div class="k">净销售</div><div class="v" id="sv_net">RM 0.00</div></div>'+
      '<div><div class="k">服务费('+(state.settings.serviceRate||0)+'%)</div><div class="v" id="sv_service">RM 0.00</div></div>'+
      '<div><div class="k">应收合计</div><div class="v" id="sv_recv">RM 0.00</div></div>'+
      '<div><div class="k">实收合计</div><div class="v" id="sv_collect">RM 0.00</div></div>'+
      '<div><div class="k">差额</div><div class="v" id="sv_diff">RM 0.00</div></div>'+
    '</div>'+
    '<div class="grid g4">'+
      field('日期','s_date','date')+
      field('酒水销售','s_liquor')+field('食物销售','s_food')+field('软饮销售','s_soft')+
      field('折扣 / Void（填正数）','s_discount')+field('开台数','s_covers')+field('客人数','s_guests')+
    '</div>'+
    '<div class="section-title">收款方式（当天实收）</div>'+
    '<div class="grid g4">'+
      field('现金','s_cash')+field('卡','s_card')+field("Touch 'n Go",'s_tng')+field('GrabPay','s_grab')+
      field('DuitNow QR','s_duitnow')+field('Boost','s_boost')+field('其他','s_other')+
    '</div>'+

function bindSalesForm(){

      liquor:readNum('s_liquor'), food:readNum('s_food'), soft:readNum('s_soft'), discount:readNum('s_discount'),
      cash:readNum('s_cash'), card:readNum('s_card'), tng:readNum('s_tng'), grab:readNum('s_grab'),

      comp:readNum('s_comp'), spill:readNum('s_spill'), covers:readNum('s_covers'), guests:readNum('s_guests'),

function updateSalesSummary(){
  const net = r2(readNum('s_liquor')+readNum('s_food')+readNum('s_soft')-readNum('s_discount'));
  const sv = r2(net*(state.settings.serviceRate||0)/100);
  const recv = r2(net+sv);
  const col = r2(readNum('s_cash')+readNum('s_card')+readNum('s_tng')+readNum('s_grab')+readNum('s_duitnow')+readNum('s_boost')+readNum('s_other'));
  const diff = r2(col-recv);
  document.getElementById('sv_net').textContent=rm(net);
  document.getElementById('sv_service').textContent=rm(sv);
  document.getElementById('sv_recv').textContent=rm(recv);
  document.getElementById('sv_collect').textContent=rm(col);
  const d=document.getElementById('sv_diff'); d.textContent=rm(diff); d.className='v '+(diff===0?'diff-ok':'diff-bad');
}
function refreshSalesTable(){
  const q=(document.getElementById('salesSearch').value||'').trim().toLowerCase();
  const rows = state.sales.slice().sort(sortDesc).filter(x=> !q || x.date.includes(q) || (x.note||'').toLowerCase().includes(q)).slice(0,300);
  const tb=document.getElementById('salesTbody');

    const c=calcRow(x);
    return '<tr><td>'+x.date+'</td><td class="num">'+MYR.format(c.liquor)+'</td><td class="num">'+MYR.format(c.food)+'</td><td class="num">'+MYR.format(c.soft)+'</td>'+
      '<td class="num"><b>'+rm(c.net)+'</b></td><td class="num">'+rm(c.service)+'</td><td class="num">'+rm(c.receivable)+'</td><td class="num">'+rm(c.collected)+'</td>'+

      '<td class="muted small">'+esc(x.note||'')+'</td>'+

  }).join('') : '<tr><td colspan="11" class="empty">还没有记录 — 在上面填好日期和金额，点保存</td></tr>';
  tb.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click',()=>fillSalesForm(b.dataset.edit)));

function fillSalesForm(id){

function renderPL(){
  const from=document.getElementById('r_from').value||(state.settings.year+'-01-01');
  const to=document.getElementById('r_to').value||(state.settings.year+'-12-31');
  const p=calcPL(from,to);
  const rate=(state.settings.serviceRate||0);
  const lines=[];
  const row=(l,v,cls)=>{ lines.push('<tr class="'+cls+'"><td>'+l+'</td><td>'+v+'</td></tr>'); };
  row('酒水销售', rm(p.liquor));
  row('食物销售', rm(p.food));
  row('软饮销售', rm(p.soft));
  row('折扣 / Void（减）', '-'+rm(p.disc));
  row('净销售', rm(p.net), 'total');
  row('服务费收入（'+rate+'%）', rm(p.service));
  row('总收入', rm(p.income), 'total');
  row('—— 直接成本 ——','');
  COGS_CATS.forEach(c=>{ if(p.cogs[c]) row(c, rm(p.cogs[c])); });
  row('直接成本合计', rm(p.cogsT), 'total');
  row('毛利', rm(p.gross), 'total');
  row('毛利率', (p.net? (p.gross/p.net*100).toFixed(1):'0')+'%');
  row('—— 营业费用 ——','');
  Object.keys(p.opex).sort().forEach(c=> row(c, rm(p.opex[c])));
  row('营业费用合计', rm(p.opexT), 'total');
  row('净利润（合伙人分配前）', rm(p.netProfit), 'total');
  const shares=state.settings.partners.map(pt=>row('↳ 分给 '+esc(pt.name)+'（'+pt.pct+'%）', rm(p.netProfit*pt.pct/100)));
  document.getElementById('plCard').innerHTML =
    '<h3>📊 损益表 '+from+' ～ '+to+'</h3><div class="tblwrap"><table class="pl-table"><tbody>'+lines.join('')+'</tbody></table></div>'+
    '<p class="muted small" style="margin-top:10px">毛利率 = 毛利 ÷ 净销售（不含服务费，服务费基本要分回员工）。净利润按分成比例自动分给各合伙人，可直接用于 Form P / Form B。</p>';
  // 月度
  let mrows='';
  for(let m=1;m<=12;m++){
    const mr=monthRange(state.settings.year,m); const mp=calcPL(mr.from,mr.to);
    mrows+='<tr><td>'+m+'月</td><td class="num">'+rm(mp.net)+'</td><td class="num">'+rm(mp.service)+'</td><td class="num">'+rm(mp.cogsT)+'</td><td class="num">'+rm(mp.opexT)+'</td><td class="num">'+rm(mp.gross)+'</td><td class="num">'+(mp.net?(mp.gross/mp.net*100).toFixed(1):'0')+'%</td></tr>';
  }
  const yp=calcPL(state.settings.year+'-01-01', state.settings.year+'-12-31');
  mrows+='<tr class="total"><td>全年</td><td class="num">'+rm(yp.net)+'</td><td class="num">'+rm(yp.service)+'</td><td class="num">'+rm(yp.cogsT)+'</td><td class="num">'+rm(yp.opexT)+'</td><td class="num">'+rm(yp.gross)+'</td><td class="num">'+(yp.net?(yp.gross/yp.net*100).toFixed(1):'0')+'%</td></tr>';
  document.getElementById('monthCard').innerHTML =
    '<h3>📅 月度汇总（'+state.settings.year+'）</h3><div class="tblwrap"><table><thead><tr>'+
    '<th>月份</th><th class="num">净销售</th><th class="num">服务费</th><th class="num">直接成本</th><th class="num">营业费用</th><th class="num">毛利</th><th class="num">毛利率</th></tr></thead><tbody>'+mrows+'</tbody></table></div>';
}

document.getElementById('importFile').addEventListener('change', e=>{
  const f=e.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{ try{ const j=JSON.parse(rd.result);
    if(!j.settings||!j.sales) throw 0;
    if(confirm('导入将覆盖当前数据，继续？')){ state=j; save(); toast('✅ 导入成功'); renderSettings(); }
  }catch(err){ toast('❌ 文件格式不对'); } };
  rd.readAsText(f); e.target.value='';
});

/* ================= 同步 & 导出 ================= */
function salesRowsForSync(){
  return state.sales.slice().sort(sortAsc).map(x=>{ const c=calcRow(x);
    return [x.date, c.liquor, c.food, c.soft, c.disc, c.net, c.service, c.receivable,
            num(x.cash), num(x.card), num(x.tng), num(x.grab), num(x.duitnow), num(x.boost), num(x.other),
            c.collected, c.diff, num(x.comp), num(x.spill), num(x.covers), num(x.guests), x.note||''];
  });
}
function expenseRowsForSync(){
  return state.expenses.slice().sort(sortAsc).map(x=>[x.date,x.category||'其他费用',x.desc||'',x.inv||'',num(x.amount),x.pay||'现金',x.note||'']);
}
function partnerRowsForSync(){
  return state.partners.slice().sort(sortAsc).map(x=>[x.date,x.partner,x.type,x.desc||'',num(x.amount),x.note||'']);
}
function parseSalesRows(rows){
  return (rows||[]).map(r=>({ id:uid(), ts:Date.now(), date:String(r[0]||'').slice(0,10),
    liquor:num(r[1]), food:num(r[2]), soft:num(r[3]), discount:num(r[4]),
    cash:num(r[8]), card:num(r[9]), tng:num(r[10]), grab:num(r[11]), duitnow:num(r[12]), boost:num(r[13]), other:num(r[14]),
    comp:num(r[17]), spill:num(r[18]), covers:num(r[19]), guests:num(r[20]), note:(r[21]||'') }));
}
function parseExpenseRows(rows){
  return (rows||[]).map(r=>({ id:uid(), ts:Date.now(), date:String(r[0]||'').slice(0,10), category:r[1]||'其他费用', desc:r[2]||'', inv:r[3]||'', amount:num(r[4]), pay:r[5]||'现金', note:r[6]||'' }));
}
function parsePartnerRows(rows){
  return (rows||[]).map(r=>({ id:uid(), ts:Date.now(), date:String(r[0]||'').slice(0,10), partner:r[1]||'', type:r[2]||'资本投入', desc:r[3]||'', amount:num(r[4]), note:r[5]||'' }));
}
async function loadFromSheet(silent){
  const url=sheetUrl();
  if(!url){ if(!silent) toast('先在「设置」里填 Apps Script 网址'); return false; }
  const r=await tryFetch(url+(url.includes('?')?'&':'?')+'action=load');
  if(!r.ok){ if(!silent) toast('❌ '+r.hint); markSync('❌ 载入失败：'+r.hint); return false; }
  const j=r.json;
  if(j.service==='cocktail-bar-accounting'){ if(!silent) toast('⚠️ 后端是旧版本：请重新粘贴最新的 AppsScript_后端.gs 并重新部署'); markSync('⚠️ 后端旧版'); return false; }
  if(j.ok===false){ if(!silent) toast('❌ '+(j.error||j.hint||'后端报错')); markSync('❌ '+(j.error||j.hint||'')); return false; }
  const serverEmpty=(j.sales||[]).length===0 && (j.expenses||[]).length===0 && (j.partners||[]).length===0;
  const localEmpty=state.sales.length===0 && state.expenses.length===0 && state.partners.length===0;
  if(serverEmpty && !localEmpty){
    // 表格是空的、本机有数据 → 保留本机数据，并推送到表格
    saveLocal(); markSync('表格是空的，本机有数据 → 准备上传'); setTimeout(pushAll, 800);
    if(!silent) toast('表格还是空的，已保留本机数据并准备上传');
    return true;
  }
  if(j.sales!==undefined){ state.sales=parseSalesRows(j.sales); state.expenses=parseExpenseRows(j.expenses); state.partners=parsePartnerRows(j.partners); }
  if(j.settings){ state.settings=Object.assign({}, state.settings, j.settings); }
  saveLocal(); markSync('⬇ 已从 Google Sheets 载入');
  return true;
}
async function pushAll(){
  const url=sheetUrl(); if(!url) return false;
  const body=JSON.stringify({ action:'save',
    settings:{ shop:state.settings.shop, year:state.settings.year, serviceRate:state.settings.serviceRate, partners:state.settings.partners },
    sales: salesRowsForSync(), expenses: expenseRowsForSync(), partners: partnerRowsForSync() });
  const r=await tryFetch(url,{method:'POST',mode:'cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body});
  if(!r.ok){ markSync('❌ 同步失败：'+r.hint); return false; }
  const j=r.json;
  if(!j.ok){ markSync('❌ 同步失败：'+(j.error||j.hint||'')); return false; }
  markSync('✅ 已同步 '+(j.written?(j.written.sales||0):0)+' 天销售 / '+(j.written?(j.written.expenses||0):0)+' 笔费用 / '+(j.written?(j.written.partners||0):0)+' 笔合伙人记录');
  return true;
}
async function tryFetch(url, opts){
  let resp;
  try{ resp = await fetch(url, opts||{method:'GET', mode:'cors'}); }
  catch(e){ return {ok:false, status:0, hint:'网络错误，连不上这个网址（检查网址拼写 / 网络）'}; }
  let text='';
  try{ text = await resp.text(); }catch(e){}
  if(!resp.ok){
    return {ok:false, status:resp.status, hint:'服务器返回 HTTP '+resp.status+(resp.status===302?'（被重定向，通常是部署时「谁可以访问」没设成「任何人」）':'（请求被拒绝）')};
  }
  if(/^\s*</.test(text)){
    if(/accounts\.google|login|Authorization required|Sign in/i.test(text)) return {ok:false, status:resp.status, hint:'对方返回了 Google 登录页 → 重新部署，把「谁可以访问」改成「任何人 (Anyone)」'};
    return {ok:false, status:resp.status, hint:'对方返回了网页而不是数据 → 可能是旧版代码，或脚本还没完成授权'};
  }
  try{ return {ok:true, status:resp.status, json:JSON.parse(text)}; }
  catch(e){ return {ok:false, status:resp.status, hint:'返回内容不是有效数据（前100字：'+text.slice(0,100)+'）'}; }
}
async function testSync(){
  const url=sheetUrl(); if(!url){ toast('先在设置里填 Apps Script 网址'); return; }
  toast('⏳ 正在测试连接…');
  const r=await tryFetch(url+(url.includes('?')?'&':'?')+'action=load');
  if(!r.ok){ toast('❌ '+r.hint); markSync('❌ 测试失败：'+r.hint); return; }
  const j=r.json;
  if(j.service==='cocktail-bar-accounting'){ toast('⚠️ 后端还是旧版本：请重新粘贴最新的 .gs 代码并重新部署'); return; }
  if(j.ok===false){ toast('❌ '+(j.error||j.hint||'后端报错')); return; }

function csvDownload(name, headers, rows){
  const q=v=>{ v=(v==null?'':String(v)); return /[",\n]/.test(v)? '"'+v.replace(/"/g,'""')+'"' : v; };
  const csv='\uFEFF'+[headers,...rows].map(r=>r.map(q).join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click(); URL.revokeObjectURL(a.href);
}
